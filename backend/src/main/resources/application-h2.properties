# ============================================
# H2 Profile - In-Memory Database for Local Development
# ============================================

# ============================================
# Server Configuration
# ============================================
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-stacktrace=on-param
server.servlet.encoding.charset=UTF-8

# ============================================
# Frontend Static Resources
# ============================================
spring.web.resources.static-locations=file:${CLIENT_DIST_DIR:../client/dist/},classpath:/static/

# ============================================
# Database Configuration (H2 In-Memory)
# ============================================
spring.datasource.url=jdbc:h2:mem:shift_scheduler;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ============================================
# Flyway Migration
# ============================================
spring.flyway.enabled=false

# ============================================
# Logging Configuration
# ============================================
logging.level.root=WARN
logging.level.com.shiftscheduler.server=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.web.servlet.ServletWebServerApplicationContext=INFO
logging.level.org.hibernate.engine.transaction.internal.TransactionImpl=DEBUG
